<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* 800×800, but YouTube renders it as a circle down to 98px, so nothing but
     the mark lives here and it stays inside the inscribed square. */
  html, body { width: 800px; height: 800px; }
  body { --grid: 34px; --dot: 1.3px; display: flex; align-items: center; justify-content: center; }
  .mark {
    --mark: 520px;
    z-index: 4;
    box-shadow: 0 26px 54px -16px rgba(43, 32, 16, 0.42);
  }
</style>
</head>
<body class="paper">
  <div class="mark">
    <div class="head"></div>
    <svg viewBox="8 8 112 112" fill="none" stroke="#333333" stroke-linecap="round">
      <g transform="translate(64 73) scale(0.8) translate(-64 -65)">
        <circle cx="64" cy="42" r="7.75" stroke-width="5.5"/>
        <path d="M64 38V93" stroke-width="6"/>
        <path d="M45 55H83" stroke-width="6"/>
        <path d="M39 64A25 25 0 0 0 89 64" stroke-width="6"/>
        <path d="M40 66L30 50" stroke-width="6.4"/>
        <path d="M88 66L98 50" stroke-width="6.4"/>
      </g>
    </svg>
  </div>
</body>
</html>
